{% extends "admin/base.html" %}
{% block title %}Lend Book - Admin{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Lend Book</h2>
    <a href="{{ url_for('admin_borrows') }}" class="btn btn-outline btn-sm">&larr; Back</a>
</header>

<div class="page-content">
    <div class="card" style="max-width: 600px;">
        <form method="POST">
            <div class="form-group">
                <label for="book_id">Book *</label>
                <select id="book_id" name="book_id" class="form-control" required>
                    <option value="">-- Select Book --</option>
                    {% for book in books %}
                    <option value="{{ book.id }}">{{ book.title }} ({{ book.available }} available)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="student_id">Student *</label>
                <select id="student_id" name="student_id" class="form-control" required>
                    <option value="">-- Select Student --</option>
                    {% for student in students %}
                    <option value="{{ student.id }}">{{ student.name }} ({{ student.student_number }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="duration">Duration (days)</label>
                <select id="duration" name="duration" class="form-control">
                    <option value="7">7 days</option>
                    <option value="14" selected>14 days</option>
                    <option value="21">21 days</option>
                    <option value="30">30 days</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Lend Book</button>
        </form>
    </div>
</div>
{% endblock %}
