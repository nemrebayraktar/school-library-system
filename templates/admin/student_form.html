{% extends "admin/base.html" %}
{% block title %}{{ 'Edit Student' if student else 'Add Student' }} - Admin{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">{{ 'Edit Student' if student else 'Add New Student' }}</h2>
    <a href="{{ url_for('admin_students') }}" class="btn btn-outline btn-sm">&larr; Back</a>
</header>

<div class="page-content">
    <div class="card" style="max-width: 600px;">
        <form method="POST">
            <div class="form-group">
                <label for="student_number">Student Number *</label>
                <input type="text" id="student_number" name="student_number" class="form-control" value="{{ student.student_number if student else '' }}" required>
            </div>
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ student.name if student else '' }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ student.email if student else '' }}">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" class="form-control" value="{{ student.phone if student else '' }}">
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" class="form-control" value="{{ student.department if student else '' }}">
            </div>
            <button type="submit" class="btn btn-primary">{{ 'Update Student' if student else 'Add Student' }}</button>
        </form>
    </div>
</div>
{% endblock %}
