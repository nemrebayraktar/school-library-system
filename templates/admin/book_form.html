{% extends "admin/base.html" %}
{% block title %}{{ 'Edit Book' if book else 'Add Book' }} - Admin{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">{{ 'Edit Book' if book else 'Add New Book' }}</h2>
    <a href="{{ url_for('admin_books') }}" class="btn btn-outline btn-sm">&larr; Back</a>
</header>

<div class="page-content">
    <div class="card" style="max-width: 800px;">
        <form method="POST" enctype="multipart/form-data" class="form-grid">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ book.title if book else '' }}" required>
            </div>
            <div class="form-group">
                <label for="author">Author *</label>
                <input type="text" id="author" name="author" class="form-control" value="{{ book.author if book else '' }}" required>
            </div>
            <div class="form-group">
                <label for="category_id">Category</label>
                <select id="category_id" name="category_id" class="form-control">
                    <option value="">-- Select Category --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if book and book.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" class="form-control" value="{{ book.isbn if book else '' }}">
            </div>
            <div class="form-group">
                <label for="publish_year">Publish Year</label>
                <input type="number" id="publish_year" name="publish_year" class="form-control" value="{{ book.publish_year if book else '' }}">
            </div>
            <div class="form-group">
                <label for="page_count">Page Count</label>
                <input type="number" id="page_count" name="page_count" class="form-control" value="{{ book.page_count if book else '' }}">
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" class="form-control" value="{{ book.quantity if book else 1 }}" min="1">
            </div>
            <div class="form-group">
                <label for="floor">Floor</label>
                <input type="number" id="floor" name="floor" class="form-control" value="{{ book.floor if book else 1 }}" min="1">
            </div>
            <div class="form-group">
                <label for="shelf">Shelf</label>
                <input type="text" id="shelf" name="shelf" class="form-control" value="{{ book.shelf if book else 'A' }}">
            </div>
            <div class="form-group" style="grid-column: 1/-1;">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="4">{{ book.description if book else '' }}</textarea>
            </div>
            <div class="form-group" style="grid-column: 1/-1;">
                <label for="image">Cover Image</label>
                <input type="file" id="image" name="image" class="form-control" accept="image/*">
                {% if book and book.image_path %}
                <img src="{{ url_for('static', filename='uploads/' + book.image_path) }}" alt="Current cover" style="margin-top: 0.5rem; max-height: 150px; border-radius: 4px;">
                {% endif %}
            </div>
            <div class="form-group" style="grid-column: 1/-1;">
                <button type="submit" class="btn btn-primary">{{ 'Update Book' if book else 'Add Book' }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
