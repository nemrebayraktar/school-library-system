{% extends "admin/base.html" %}
{% block title %}Categories - Admin{% endblock %}

{% block content %}
<header class="page-header">
    <h2 class="page-title">Categories</h2>
</header>

<div class="page-content">
    <div class="card" style="max-width: 600px; margin-bottom: 1.5rem;">
        <form method="POST" action="{{ url_for('admin_category_add') }}" style="display: flex; gap: 1rem;">
            <input type="text" name="name" class="form-control" placeholder="New category name..." required>
            <button type="submit" class="btn btn-primary">Add</button>
        </form>
    </div>
    
    <div class="card" style="max-width: 600px;">
        <table class="table">
            <thead><tr><th>Name</th><th>Books</th><th>Action</th></tr></thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <td><strong>{{ cat.name }}</strong></td>
                    <td>{{ cat.books|length }}</td>
                    <td>
                        <form action="{{ url_for('admin_category_delete', id=cat.id) }}" method="POST" onsubmit="return confirm('Are you sure?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No categories yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
